# CI for the whole repo. Each job sets its own working-directory, so server and client jobs stay
# independent of each other.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Restrict the default GITHUB_TOKEN to read-only; none of these jobs need to write to the repo.
permissions:
  contents: read

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # --check fails the job instead of rewriting files; formatting the repo is a local dev step.
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Caches ~/.cargo and target/ keyed on Cargo.lock, so repeat runs skip most recompilation.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      # -D warnings turns every clippy lint into a hard failure; otherwise warnings are silently ignored.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: server test (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # `#[sqlx::test]` (used throughout server/src) needs a live Postgres to connect to: it
    # spins up a throwaway, migrated database per test case and drops it afterwards.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Admin connection sqlx::test uses to create/drop each test's throwaway database.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DEFAULT_LANGUAGE: en
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --all-features

  e2e:
    name: client e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    # Each Playwright worker provisions its own throwaway database against this same admin
    # connection (mirrors the `test` job's sqlx::test pattern above, just keyed per worker instead
    # of per test — see client/playwright/lib/db.ts), and runs its own server + Vite instance
    # against it (client/playwright/fixtures/worker-infra.ts).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PLAYWRIGHT_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # global-setup.ts builds the server binary itself (see client/playwright/tests/global-setup.ts) —
      # no separate cargo build step needed here.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright/playwright-report/
          retention-days: 7
