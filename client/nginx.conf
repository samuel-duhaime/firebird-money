server {
    listen 80;
    root /usr/share/nginx/html;

    # Sign-in needs no email here, so refuse other host names: otherwise a malicious website could
    # point its own name at this computer and use the app as if it were you.
    if ($host !~ ^(localhost|127\.0\.0\.1)$) {
        return 403;
    }

    # Forwards /api/... to the server. The variable and resolver make nginx look the server's
    # address up again on each request: an update gives the server a new one, and nginx would
    # otherwise keep using the old address until it restarts.
    location /api/ {
        resolver 127.0.0.11 valid=1s;
        set $api_server http://server:3055;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Statement import uploads up to 10 MB, then streams its progress over a slow Claude call.
        client_max_body_size 12m;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # File names in /assets change with their contents, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other path is a page of the app. Never cached, so an update shows up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
